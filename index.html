<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辦公室飲料訂購系統 - 今日點單統計</title>
    <!-- Google Fonts for professional typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- React 18 & ReactDOM 18 CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel Standalone (In-browser compilation for standalone HTML execution) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        // Tailwind Custom Configurations based on Geometric Balance Design Theme
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                brand: {
                  primary: '#sky-500', 
                  dark: '#0F172A',     // Slate-900
                  slateBlue: '#334155' // Slate-700
                }
              },
              fontFamily: {
                sans: ['"Inter"', '"Noto Sans TC"', 'sans-serif'],
                mono: ['"JetBrains Mono"', 'monospace'],
              }
            }
          }
        }
    </script>
    
    <style>
        /* Smooth micro-animations */
        .order-transition {
          transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover {
          transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:active {
          transform: scale(0.97);
        }
        /* Geometric Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
          width: 4px;
          height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
          background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: #CBD5E1;
          border-radius: 10px;
        }
        /* Heartbeat loading wave */
        @keyframes shine {
          0% { background-position: -200% 0; }
          100% { background-position: 200% 0; }
        }
        .skeleton-pulse {
          background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 37%, #f1f5f9 50%);
          background-size: 200% 100%;
          animation: shine 1.5s infinite;
        }
    </style>
</head>
<body class="bg-[#F1F5F9] text-[#1E293B] font-sans min-h-screen flex flex-col selection:bg-sky-200 selection:text-sky-900">

    <!-- Mounting Point for our React Application -->
    <div id="root"></div>

    <!-- The actual React 18 Single-File Code -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Constants & Integrations
        const API_URL = "https://script.google.com/macros/s/AKfycbwuoJ6TjT6kvuOJN6C2RwY8P3rf7RKVR6OXYk4OjIoZDWWOnP63fIDSYoBMrZ_0iEU8/exec";

        // Elegantly crafted fallback menu in case Google Sheets connectivity is pending or offline
        const DEFAULT_MENU = [
          { name: "手採茉莉綠茶", price: 30, category: "經典茶飲", description: "精選頂級綠茶窨製新鮮茉莉，花香高雅悠長，回甘清甜。" },
          { name: "極上大吉嶺紅茶", price: 35, category: "經典茶飲", description: "融合麥芽甜香與葡萄莊園芬芳，口感成熟醇厚，餘韻綿長。" },
          { name: "四季玉露春茶", price: 35, category: "經典茶飲", description: "半發酵茶香。茶湯澄清翠綠，清潤解渴，淡雅花果香氣。" },
          { name: "經典莊園奶茶", price: 45, category: "特調奶香", description: "獨家黃金茶乳比例調配，重現濃郁台式懷舊好味道。" },
          { name: "黑糖波霸奶茶", price: 55, category: "特調奶香", description: "手炒黑糖蜜漬大顆波霸珍珠，Ｑ彈香醇，口感層次極致豐富。" },
          { name: "紅茶拿鐵拿破崙", price: 60, category: "純鮮乳坊", description: "百分之百優質鮮乳入茶，茶感甘美乳香絲滑，健康無負擔。" },
          { name: "翡翠檸檬拿鐵", price: 60, category: "純鮮乳坊", description: "研磨綠茶融入新鮮牧場乳源，清新順喉而不過甜。" },
          { name: "初戀手打百香綠", price: 55, category: "原汁鮮果", description: "手榨鮮百香果粒微酸甘甜，交織茉莉綠茶，解膩解暑推薦。" },
          { name: "九如金桔雙Q青", price: 60, category: "原汁鮮果", description: "純榨香檸金桔，豪邁加入大波霸與愛玉寒天，咀嚼控最愛！" },
          { name: "法式焦糖厚奶蓋", price: 65, category: "限定特調", description: "鮮乳打製厚實綿密玫瑰海鹽奶蓋，鋪頂炙燒焦糖，甜鹹交織。" }
        ];

        // Standard categories for visual filtering tabs
        const MENU_CATEGORIES = ["全部", "經典茶飲", "特調奶香", "純鮮乳坊", "原汁鮮果", "限定特調"];

        // Sugar levels options (Geometric Slate Theme adaptation)
        const SUGAR_OPTIONS = [
          { label: "正常", value: "正常糖 (100%)", desc: "濃郁滿分" },
          { label: "七分", value: "少糖 (70%)", desc: "甜蜜適中" },
          { label: "半糖", value: "半糖 (50%)", desc: "經典推薦" },
          { label: "微糖", value: "微糖 (30%)", desc: "清爽首選" },
          { label: "無糖", value: "無糖 (0%)", desc: "純粹清茶" }
        ];

        // Ice levels options (Geometric Slate Theme adaptation)
        const ICE_OPTIONS = [
          { label: "正常", value: "正常冰", desc: "酷涼勁爽" },
          { label: "少冰", value: "少冰", desc: "微冰感" },
          { label: "微冰", value: "微冰", desc: "保冷常溫" },
          { label: "去冰", value: "去冰", desc: "不附冰塊" },
          { label: "熱", value: "溫熱", desc: "暖胃舒心" }
        ];

        // Unique ID Generator for local mock persistence
        const generateUUID = () => {
          return 'local-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now();
        };

        // --- Custom SVG Icons to match Geometric Balance Theme ---
        const IconCoffee = () => (
          <svg className="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M17 8h1a4 4 0 1 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" />
            <line x1="6" y1="2" x2="6" y2="4"></line>
            <line x1="10" y1="2" x2="10" y2="4"></line>
            <line x1="14" y1="2" x2="14" y2="4"></line>
          </svg>
        );

        const IconPlus = () => (
          <svg className="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
          </svg>
        );

        const IconEdit = () => (
          <svg className="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
        );

        const IconTrash = () => (
          <svg className="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        );

        const IconRefresh = () => (
          <svg className="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 7.89M9 11l3-3 3 3m-3-3v12" />
          </svg>
        );

        const IconCheck = () => (
          <svg className="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3">
            <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        );

        const IconSearch = () => (
          <svg className="w-4 h-4 stroke-current text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        );

        const IconClipboard = () => (
          <svg className="w-12 h-12 stroke-current text-slate-300 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.5">
            <path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
          </svg>
        );

        const IconUser = () => (
          <svg className="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        );

        const IconDollar = () => (
          <svg className="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        );

        const IconCupQuantity = () => (
          <svg className="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
          </svg>
        );

        // --- Custom Toast Component ---
        function Toast({ message, type, onClose }) {
          useEffect(() => {
            const timer = setTimeout(() => {
              onClose();
            }, 4000);
            return () => clearTimeout(timer);
          }, [onClose]);

          const bgClass = {
            success: "bg-sky-600 border-sky-500 text-white shadow-sky-100",
            error: "bg-rose-600 border-rose-500 text-white shadow-rose-100",
            info: "bg-slate-800 border-slate-700 text-white shadow-slate-200"
          }[type] || "bg-sky-600 border-sky-500 text-white shadow-sky-100";

          return (
            <div className={`fixed right-4 bottom-4 z-50 overflow-hidden flex items-center px-4 py-3 rounded-xl border shadow-lg order-transition ${bgClass}`}>
              <div className="flex items-center space-x-2 text-sm font-medium">
                {type === 'success' && <IconCheck />}
                {type === 'error' && (
                  <svg className="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                  </svg>
                )}
                <span>{message}</span>
              </div>
              <button 
                onClick={onClose} 
                className="ml-4 hover:opacity-80 focus:outline-none focus:ring-1 focus:ring-white/50 rounded p-0.5 text-xs inline-flex items-center"
              >
                ✕
              </button>
            </div>
          );
        }

        // --- OrderForm Component ---
        function OrderForm({ menu, onSubmit, isSubmitting, editingOrder, onCancelEdit }) {
          const [name, setName] = useState("");
          const [selectedDrink, setSelectedDrink] = useState(null);
          const [sugar, setSugar] = useState("半糖 (50%)");
          const [ice, setIce] = useState("少冰");
          const [quantity, setQuantity] = useState(1);
          const [searchQuery, setSearchQuery] = useState("");
          const [activeCategory, setActiveCategory] = useState("全部");

          // Fill form fields if editingOrder changes
          useEffect(() => {
            if (editingOrder) {
              setName(editingOrder.name);
              const drinkMatched = menu.find(d => d.name === editingOrder.drink);
              setSelectedDrink(drinkMatched || { name: editingOrder.drink, price: editingOrder.totalPrice / editingOrder.quantity, category: "其他", description: "已訂購之飲品" });
              setSugar(editingOrder.sugar);
              setIce(editingOrder.ice);
              setQuantity(editingOrder.quantity);
            } else {
              // Preset clean state
              setSelectedDrink(null);
              setSugar("半糖 (50%)");
              setIce("少冰");
              setQuantity(1);
            }
          }, [editingOrder, menu]);

          const filteredMenu = useMemo(() => {
            return menu.filter(item => {
              const matchedCategory = activeCategory === "全部" || item.category === activeCategory;
              const matchedSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                    item.description.toLowerCase().includes(searchQuery.toLowerCase());
              return matchedCategory && matchedSearch;
            });
          }, [menu, searchQuery, activeCategory]);

          const totalPrice = useMemo(() => {
            if (!selectedDrink) return 0;
            return selectedDrink.price * quantity;
          }, [selectedDrink, quantity]);

          const handleFormSubmit = (e) => {
            e.preventDefault();
            if (!name.trim()) {
              alert("請填寫訂購人姓名！");
              return;
            }
            if (!selectedDrink) {
              alert("請選擇一款飲料！");
              return;
            }
            if (quantity <= 0) {
              alert("數量必須至少為 1 杯！");
              return;
            }

            const payloadData = {
              name: name.trim(),
              drink: selectedDrink.name,
              sugar,
              ice,
              quantity,
              totalPrice
            };

            if (editingOrder) {
              payloadData.orderId = editingOrder.orderId;
            }

            onSubmit(payloadData);
            
            // Auto scroll or preset
            if (!editingOrder) {
              // Keep matching name but clear drink for speedy multiple ordering
              setSelectedDrink(null);
              setQuantity(1);
            }
          };

          return (
            <div id="order-form" className="bg-white border border-slate-200 rounded-2xl shadow-inner p-6 flex flex-col justify-between order-transition">
              <div className="flex items-center justify-between border-b border-slate-100 pb-4 mb-6">
                <div>
                  <h2 className="text-base font-bold text-slate-900 tracking-tight flex items-center gap-2">
                    <span className="p-2 rounded-xl bg-sky-500 text-white">
                      <IconCoffee />
                    </span>
                    {editingOrder ? "修改飲料點單" : "填寫點單明細"}
                  </h2>
                  <p className="text-xs text-slate-400 mt-1">
                    {editingOrder ? `正在編輯 ${editingOrder.name} 的點單項目` : "精選茶鋪！請先填寫姓名並選擇今日茶品"}
                  </p>
                </div>
                {editingOrder && (
                  <button
                    id="btn-cancel-edit"
                    type="button"
                    onClick={onCancelEdit}
                    className="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 font-medium btn-hover"
                  >
                    取消修改
                  </button>
                )}
              </div>

              <form onSubmit={handleFormSubmit} className="space-y-6">
                
                {/* 1. 訂購人姓名 */}
                <div>
                  <label htmlFor="input-order-name" className="block text-[11px] font-bold text-slate-400 uppercase mb-2 tracking-wider">
                    訂購人姓名 <span className="text-sky-500">*</span>
                  </label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                      <IconUser />
                    </div>
                    <input
                      id="input-order-name"
                      type="text"
                      required
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="例如：王小明"
                      className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 outline-none transition-all text-sm font-medium"
                    />
                  </div>
                </div>

                {/* 2. 選擇飲品 */}
                <div>
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2">
                    <label className="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                      選擇飲品 <span className="text-sky-500">*</span>
                    </label>
                    
                    {/* Tiny Search */}
                    <div className="relative inline-block w-full sm:w-48">
                      <span className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                        <IconSearch />
                      </span>
                      <input
                        id="input-menu-search"
                        type="search"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="搜尋飲料名稱..."
                        className="w-full pl-8 pr-3 py-1 bg-slate-100 rounded-lg text-xs font-normal focus:bg-white focus:outline-none focus:ring-1 focus:ring-sky-500"
                      />
                    </div>
                  </div>

                  {/* Menu Category Filter Tabs */}
                  <div className="flex gap-1.5 overflow-x-auto pb-2 custom-scrollbar mb-3 border-b border-dashed border-slate-100">
                    {MENU_CATEGORIES.map(category => (
                      <button
                        key={category}
                        id={`tab-category-${category}`}
                        type="button"
                        onClick={() => setActiveCategory(category)}
                        className={`text-xs px-2.5 py-1 rounded-lg border shrink-0 font-medium btn-hover ${
                          activeCategory === category
                            ? "bg-sky-500 text-white border-sky-500"
                            : "bg-white text-slate-500 border-slate-200 hover:bg-slate-50"
                        }`}
                      >
                        {category}
                      </button>
                    ))}
                  </div>

                  {/* Visual Grid of Drinks (Scrolling view matching Geometric design height) */}
                  <div className="space-y-2 max-h-[190px] overflow-y-auto pr-1 custom-scrollbar">
                    {filteredMenu.length > 0 ? (
                      filteredMenu.map(drink => {
                        const isChosen = selectedDrink && selectedDrink.name === drink.name;
                        return (
                          <div
                            key={drink.name}
                            id={`drink-card-${drink.name}`}
                            onClick={() => setSelectedDrink(drink)}
                            className={`flex items-center justify-between p-3 rounded-xl border cursor-pointer order-transition relative ${
                              isChosen
                                ? "border-2 border-sky-500 bg-sky-50"
                                : "border-slate-100 bg-slate-50 hover:bg-slate-100"
                            }`}
                          >
                            <div className="min-w-0 flex-1 pr-3">
                              <div className="flex items-center gap-2">
                                <span className={`text-[10px] px-1.5 py-0.5 rounded font-medium shrink-0 ${
                                  isChosen ? "bg-sky-200 text-sky-800" : "bg-slate-200/60 text-slate-600"
                                }`}>
                                  {drink.category}
                                </span>
                                <h4 className="font-bold text-slate-800 text-sm truncate">
                                  {drink.name}
                                </h4>
                              </div>
                              <p className="text-[11px] text-slate-500 mt-0.5 truncate max-w-xs">
                                {drink.description}
                              </p>
                            </div>
                            <span className={`font-mono font-bold shrink-0 ${isChosen ? "text-sky-600" : "text-slate-500"}`}>
                              ${drink.price}
                            </span>
                          </div>
                        );
                      })
                    ) : (
                      <div className="text-center py-6 text-slate-400 text-xs">
                        ⚠️ 找不到相符的飲料，換個搜尋詞試試吧！
                      </div>
                    )}
                  </div>
                </div>

                {/* Sugar & Ice combined geometric grid layout to match theme mockups */}
                <div className="grid grid-cols-2 gap-4">
                  {/* 3. 甜度 */}
                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 uppercase mb-2 tracking-wider">
                      甜度
                    </label>
                    <div className="flex flex-wrap gap-1">
                      {SUGAR_OPTIONS.map(opt => {
                        const isActive = sugar === opt.value;
                        return (
                          <button
                            key={opt.value}
                            id={`btn-sugar-${opt.label}`}
                            type="button"
                            onClick={() => setSugar(opt.value)}
                            className={`px-2 py-1 text-[11px] rounded transition-all font-medium ${
                              isActive
                                ? "bg-sky-500 text-white font-bold"
                                : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                            }`}
                            title={opt.desc}
                          >
                            {opt.label}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* 4. 冰塊 */}
                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 uppercase mb-2 tracking-wider">
                      冰塊
                    </label>
                    <div className="flex flex-wrap gap-1">
                      {ICE_OPTIONS.map(opt => {
                        const isActive = ice === opt.value;
                        return (
                          <button
                            key={opt.value}

        // --- OrderList Component ---
        function OrderList({ orders, onEdit, onDelete, isOfflineMode }) {
          
          const calculations = useMemo(() => {
            const totalCups = orders.reduce((sum, o) => sum + o.quantity, 0);
            const totalCash = orders.reduce((sum, o) => sum + o.totalPrice, 0);
            const uniqueUsers = new Set(orders.map(o => o.name)).size;
            
            // Calculate most popular item
            const drinkCounts = {};
            orders.forEach(o => {
              drinkCounts[o.drink] = (drinkCounts[o.drink] || 0) + o.quantity;
            });
            let popularDrink = "無";
            let maxCount = 0;
            Object.entries(drinkCounts).forEach(([drink, count]) => {
              if (count > maxCount) {
                maxCount = count;
                popularDrink = drink;
              }
            });

            return { totalCups, totalCash, uniqueUsers, popularDrink };
          }, [orders]);

          return (
            <div className="space-y-6">
              
              {/* Aggregate Statistics Bento Grid */}

                {/* 2. Total Cash */}

                  <div className="p-2.5 rounded-lg bg-emerald-50 text-emerald-600 shrink-0">
                    <IconDollar />
                  </div>
                  <div className="min-w-0">
                    <span className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">點單總金額</span>
                    <span id="stat-cash" className="text-lg font-black text-slate-850 font-mono block truncate">${calculations.totalCash} <span className="text-xs font-normal text-slate-400">元</span></span>
                  </div>
                </div>

                {/* 3. Unique People */}
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-3.5 hover:shadow-md order-transition">
                  <div className="p-2.5 rounded-lg bg-indigo-50 text-indigo-600 shrink-0">
                    <IconUser />
                  </div>
                  <div className="min-w-0">
                    <span className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">已跟單人數</span>
                    <span id="stat-users" className="text-lg font-black text-slate-850 font-mono block truncate">{calculations.uniqueUsers} <span className="text-xs font-normal text-slate-400">人</span></span>
                  </div>
                </div>

                {/* 4. Most Popular */}
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-3.5 hover:shadow-md order-transition">
                  <div className="p-2.5 rounded-lg bg-rose-50 text-rose-500 shrink-0">
                    <svg className="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z" />
                    </svg>

              {/* Order List Card with custom Geometric design decorator */}
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col order-transition">
                
                {/* Visual Header Decorated with sky-500 column bar */}
                <div className="flex items-center justify-between border-b border-slate-200 px-6 py-4 bg-slate-50/50">
                  <div className="flex items-center">
                    <span className="w-2 h-7 bg-sky-500 rounded-full mr-3 shrink-0"></span>
                    <div>
                      <h3 className="text-base font-bold text-slate-800 tracking-tight">今日已收點單</h3>
                      <p className="text-[11px] text-slate-400 mt-0.5">顯示辦公室登記的所有飲料訂購資訊以及甜度冰塊</p>
                    </div>
                  </div>
                  <div className="flex items-center space-x-2">
                    {isOfflineMode && (
                      <span className="bg-amber-50 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-amber-200">
                        本地模擬模式

                    <span className="text-xs px-2.5 py-1 bg-white border border-slate-200 text-slate-600 rounded-lg font-semibold font-mono">
                      共 {orders.length} 筆點單

                {/* If there are no orders */}

                    <p className="text-xs text-slate-400 mt-2 max-w-sm mx-auto leading-relaxed text-center">
                      辦公室下午需要這香氣四溢的茶香原動力 🌟 請點擊左側表單為大家點亮第一杯飲料，享受悠閒快樂的飲料時光！

                      <div className="w-1/12"></div>
                    </div>
                    
                    {/* Items loop */}
                    <div className="divide-y divide-slate-100 max-h-[420px] overflow-y-auto">
                      {orders.map((order, idx) => {
                        // Extract short name for avatar
                        const avatarText = order.name ? order.name.slice(-2) : "點";
                        
                        return (
                          <div 
                            key={order.orderId || idx} 
                            id={`order-row-${order.orderId}`}

                              <div className="flex items-center space-x-2.5 min-w-0">

                                  {avatarText}

                                <span className="truncate block">{order.name}</span>

                            </div>

                            {/* Drink Specification Column */}
                            <div className="w-1/3 min-w-0 pr-2">

                                {order.drink}

                              <div className="flex gap-1 mt-1.5 flex-wrap">
                                <span className="px-1.5 py-0.5 bg-slate-100 text-[10px] rounded text-slate-450 text-slate-600">
                                  {order.sugar ? order.sugar.split(" ")[0] : "半糖"}
                                </span>
                                <span className="px-1.5 py-0.5 bg-slate-100 text-[10px] rounded text-slate-450 text-slate-600">
                                  {order.ice}
                                </span>
                              </div>
                            </div>

                            {/* Quantity column */}
                            <div className="w-1/6 text-center font-mono text-sm text-slate-700">
                              {order.quantity}
                            </div>

                            {/* Subtotal total price */}
                            <div className="w-1/6 text-right font-bold text-sky-600 font-mono text-sm">
                              NT$ {order.totalPrice}
                            </div>

                            {/* Actions panel */}
                            <div className="w-1/12 flex justify-end space-x-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 order-transition">
                              <button
                                id={`btn-edit-${order.orderId}`}
                                onClick={() => onEdit(order)}
                                className="p-1.5 text-slate-400 hover:text-sky-600 hover:bg-sky-50 rounded-lg transition-all focus:outline-none focus:ring-1 focus:ring-sky-200"
                                title="編輯此訂單"
                              >
                                ✎
                              </button>
                              <button
                                id={`btn-delete-${order.orderId}`}
                                onClick={() => {
                                  if (confirm(`確定要刪除「${order.name}」所點的「${order.drink}」嗎？`)) {
                                    onDelete(order.orderId);
                                  }
                                }}
                                className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all focus:outline-none focus:ring-1 focus:ring-rose-200"
                                title="刪除此訂單"

                      })}
                    </div>

                    {/* Bottom aggregate indicator row */}
                    <div className="bg-slate-50 p-6 flex justify-between items-center border-t border-slate-200">
                      <div className="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">
                        總收點餐統計
                      </div>
                      <div className="flex items-center space-x-4">
                        <div className="text-right">
                          <span className="text-[10px] text-slate-400 block font-bold tracking-widest uppercase">TOTAL AMOUNT</span>

        }

        // --- Core App Component ---
        function App() {
          const [orders, setOrders] = useState([]);
          const [menu, setMenu] = useState(DEFAULT_MENU);
          const [isLoadingData, setIsLoadingData] = useState(true);
          const [isSubmitting, setIsSubmitting] = useState(false);
          const [editingOrder, setEditingOrder] = useState(null);
          const [toast, setToast] = useState(null);
          const [offlineMode, setOfflineMode] = useState(false);
          const [lastUpdated, setLastUpdated] = useState("");

          // Initialize Toast trigger helper
          const showToast = (message, type = 'success') => {
            setToast({ message, type });
          };

          // Primary data fetch hook (GET)
          const fetchLatestData = async (silent = false) => {
            if (!silent) setIsLoadingData(true);
            try {
              // Standard Apps Script fetch with cached-buster URL
              const response = await fetch(`${API_URL}?t=${Date.now()}`); 
              
              if (!response.ok) {
                 throw new Error("API 伺服器響應錯誤");
              }
              
              const resData = await response.json();
              
              if (resData && resData.menu) {
                setMenu(resData.menu.length > 0 ? resData.menu : DEFAULT_MENU);
              }
              if (resData && resData.orders) {
                setOrders(resData.orders);
              }
              
              setOfflineMode(false);
              setLastUpdated(new Date().toLocaleTimeString());
              if (silent) {
                showToast("✅ 今日最新點餐資料已即時同步", "success");
              }
            } catch (error) {
              console.error("GET API Error, switching to local emulator:", error);
              enableOfflineLocalSimulation();
            } finally {
              setIsLoadingData(false);
            }
          };

          // Offline fallback activator
          const enableOfflineLocalSimulation = () => {
            setOfflineMode(true);
            setLastUpdated(new Date().toLocaleTimeString() + " - 本地");
            
            // Load orders stored in localStorage
            try {
              const localSaved = localStorage.getItem("office_drink_orders");
              if (localSaved) {
                setOrders(JSON.parse(localSaved));
              } else {
                setOrders([]);
              }
            } catch (err) {
              setOrders([]);
            }
            showToast("💡 網路受通，已自動切換至穩定的本地模擬資料儲存庫", "info");
          };

          // Onmount effects
          useEffect(() => {
            fetchLatestData();
          }, []);

          // Trigger API Action POST (Create, Update, Delete)
          const handleActionPost = async (actionType, dataPayload) => {
            setIsSubmitting(true);
            
            if (offlineMode) {
              // --- Local storage emulation ---
              setTimeout(() => {
                let currentOrders = [...orders];
                if (actionType === 'create') {
                  const newObj = {
                    ...dataPayload,
                    orderId: generateUUID(),
                    timestamp: new Date().toISOString()
                  };
                  currentOrders.push(newObj);
                  showToast(`🎉 「${newObj.name}」點單登記成功！`, "success");
                } 
                else if (actionType === 'update') {
                  currentOrders = currentOrders.map(o => o.orderId === dataPayload.orderId ? { ...o, ...dataPayload } : o);
                  showToast("✨ 變更明細完成與保存！", "success");
                  setEditingOrder(null);
                } 
                else if (actionType === 'delete') {
                  currentOrders = currentOrders.filter(o => o.orderId !== dataPayload.orderId);
                  showToast("🗑️ 飲料點單已排除！", "info");
                }

                // Persist
                localStorage.setItem("office_drink_orders", JSON.stringify(currentOrders));
                setOrders(currentOrders);
                setIsSubmitting(false);
              }, 400); // realistic mock delay response
              return;
            }

            // --- Server cloud mode API request ---
            try {
              const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                  'Content-Type': 'text/plain;charset=utf-8' // Recommended content-type to bypass complex GAS preflight blocks
                },
                body: JSON.stringify({
                  action: actionType,
                  data: dataPayload
                })
              });

              if (!response.ok) {
                throw new Error("HTTP POST submission failed");
              }

              const resJson = await response.json();
              if (resJson.status === 'success' || resJson.success === true) {
                if (actionType === 'create') {
                  showToast(`🎉 「${dataPayload.name}」今日登記完畢！`, "success");
                } else if (actionType === 'update') {
                  showToast("✨ 點餐雲端修訂成功！", "success");
                  setEditingOrder(null);
                } else if (actionType === 'delete') {
                  showToast("🗑️ 雲端指定訂單已成功退點！", "info");
                }
                
                // Fetch the absolute newest updated datasets from server
                fetchLatestData(true);
              } else {
                throw new Error(resJson.message || "伺服器處理回傳失敗");
              }
            } catch (err) {
              console.error("POST API Failed:", err);
              showToast("⚠️ 外部傳送超時，已推薦自動轉換為本地暫存追蹤模式進行", "error");
              // Enable offline simulated mode right away on error to prevent blocking user
              enableOfflineLocalSimulation();
            } finally {
              setIsSubmitting(false);
            }
          };

          const handleFormSubmit = (formData) => {
            if (editingOrder) {
              handleActionPost('update', formData);
            } else {
              handleActionPost('create', formData);
            }
          };

          const handleDeleteOrder = (orderId) => {
            handleActionPost('delete', { orderId });
          };

          const handleEditClick = (orderObj) => {
            setEditingOrder(orderObj);
            // Scroll to form view on mobile sizes
            const formEl = document.getElementById("order-form");
            if (formEl) {
              formEl.scrollIntoView({ behavior: 'smooth' });
            }
          };

          return (
            <div className="min-h-screen flex flex-col justify-between">
              
              {/* 1. Navigation Header aligned to Geometric Palette */}
              <header className="h-20 bg-gradient-to-r from-[#0F172A] to-[#334155] text-white px-4 md:px-8 flex items-center justify-between shadow-lg">
                <div className="flex items-center space-x-4">
                  <div className="bg-sky-500 p-2 rounded-xl text-white">
                    <IconCoffee />
                  </div>
                  <div>
                    <h1 id="app-title" className="text-lg md:text-xl font-black tracking-tight flex items-center gap-1.5">
                      辦公室飲料訂購系統
                      <span className="text-[9px] font-bold px-1.5 py-0.5 bg-sky-200 text-[#0F172A] rounded-full uppercase tracking-wider">
                        Active
                      </span>
                    </h1>
                    <p className="text-[10px] text-sky-200 uppercase tracking-widest font-medium">
                      Office Tea Time • 2026年05月28日
                    </p>
                  </div>
                </div>

                {/* Right control stats panel */}
                <div className="flex items-center space-x-4 md:space-x-8 text-sm">
                  
                  {/* Total Cups counts in navigation to represent Geometric details */}
                  <div className="text-right hidden sm:block">
                    <p className="text-sky-300 text-[10px] uppercase tracking-wider font-bold">今日點單</p>
                    <p className="font-semibold text-xs text-slate-100">
                      {orders.length} 份點單 / NT$ {orders.reduce((sum, o) => sum + o.totalPrice, 0)}
                    </p>
                  </div>

                  <div className="h-8 w-[1px] bg-white/20 hidden sm:block"></div>

                  {/* Connectivity Mode with refresh button */}
                  <div className="flex items-center space-x-2">
                    <div className="bg-white/10 px-3 py-1.5 rounded-lg border border-white/10 flex items-center space-x-2 text-xs">
                      <span className={`${offlineMode ? 'text-amber-400' : 'text-green-400'} inline-block text-xs`}>●</span>
                      <span className="text-white text-[11px] font-medium hidden md:inline">
                        {offlineMode ? "模擬中" : "服務連線中"}
                      </span>
                    </div>

                    <button
                      id="btn-manual-sync"
                      onClick={() => fetchLatestData(true)}
                      disabled={isLoadingData}
                      className="p-1.5 bg-white/10 hover:bg-white/20 border border-white/15 rounded-lg text-white transition-all active:scale-95 disabled:opacity-40"
                      title="重新整理資料"
                    >
                      <IconRefresh />
                    </button>
                  </div>
                </div>
              </header>

              {/* 2. Primary Layout Canvas */}
              <main className="max-w-7xl mx-auto w-full px-4 md:px-8 py-8 flex-1">
                
                {isLoadingData && orders.length === 0 ? (
                  /* Elegant full screen Pulsing skeleton when initial loading */
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    <div className="lg:col-span-12 xl:col-span-5 space-y-6">
                      <div className="skeleton-pulse h-96 rounded-2xl border border-slate-200 shadow-sm"></div>
                    </div>
                    <div className="lg:col-span-12 xl:col-span-7 space-y-6">
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="skeleton-pulse h-16 rounded-xl border border-slate-200"></div>
                        <div className="skeleton-pulse h-16 rounded-xl border border-slate-200"></div>
                        <div className="skeleton-pulse h-16 rounded-xl border border-slate-200"></div>
                        <div className="skeleton-pulse h-16 rounded-xl border border-slate-200"></div>
                      </div>
                      <div className="skeleton-pulse h-[320px] rounded-2xl border border-slate-200 shadow-sm"></div>
                    </div>
                  </div>
                ) : (
                  /* The Bento Grid Main Interface */
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                    
                    {/* Left side Order Form */}
                    <div className="lg:col-span-5">
                      <OrderForm 
                        menu={menu}
                        onSubmit={handleFormSubmit}
                        isSubmitting={isSubmitting}
                        editingOrder={editingOrder}
                        onCancelEdit={() => setEditingOrder(null)}
                      />
                    </div>

                    {/* Right side Order List with stats */}
                    <div className="lg:col-span-7">
                      <OrderList 
                        orders={orders}
                        onEdit={handleEditClick}
                        onDelete={handleDeleteOrder}
                        isOfflineMode={offlineMode}
                      />
                    </div>

                  </div>
                )}
              </main>

              {/* 3. System Footer Status bar controls */}
              <footer className="bg-white border-t border-slate-200 py-6 mt-12 shadow-sm">
                <div className="max-w-7xl mx-auto px-4 md:px-8 flex flex-col md:flex-row items-center justify-between text-xs text-slate-400 font-medium gap-4">
                  <div className="flex items-center space-x-2">
                    <span className="p-1.5 rounded bg-sky-50 text-sky-600 font-bold">🥤</span>
                    <span>© 2026 辦公室精美茶飲訂單統計面板. 拒絕手寫和複雜統計</span>
                  </div>

                  {/* Dev Sandbox Troubleshooting toggle */}
                  <div className="flex items-center space-x-3 bg-slate-50 border border-slate-200 rounded-xl p-1.5 px-3">
                    <span className="text-[10px] text-slate-500 font-bold">整合排障工具櫃：</span>
                    <button
                      id="btn-toggle-mode"
                      onClick={() => {
                        if (offlineMode) {
                          fetchLatestData();
                        } else {
                          enableOfflineLocalSimulation();
                        }
                      }}
                      className={`px-2.5 py-1 rounded-lg text-[10px] font-bold transition-all ${
                        offlineMode 
                        ? "bg-sky-600 text-white shadow-sm" 
                        : "bg-slate-200 text-slate-600 hover:bg-slate-300"
                      }`}
                    >
                      {offlineMode ? "模式：已限本地" : "強制啟用本地測試模式"}
                    </button>
                    {offlineMode && (
                      <button
                        id="btn-clear-local"
                        onClick={() => {
                          if (confirm("是否清空本地模擬的點單紀錄？")) {
                            localStorage.removeItem("office_drink_orders");
                            setOrders([]);
                            showToast("🧹 已歸零本地模擬數據！", "info");
                          }
                        }}
                        className="px-2 py-1 rounded bg-rose-50 text-rose-600 hover:bg-rose-100 font-bold text-[10px]"
                      >
                        清空暫存
                      </button>
                    )}
                  </div>
                </div>
              </footer>

              {/* Single State Toast Manager notification renderer */}
              {toast && (
                <Toast 
                  message={toast.message} 
                  type={toast.type} 
                  onClose={() => setToast(null)} 
                />
              )}

            </div>
          );
        }

        // Render our app elements inside modern ReactDOM 18 mounting standards
        const rootElement = document.getElementById("root");
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
